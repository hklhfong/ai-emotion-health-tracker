[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-emotion-health-tracker"
version = "1.0.0"
description = "An all-in-one, 100% local computer vision workstation companion: Fusing contactless rPPG pulse, AffectNet emotion, iris gaze attention, and local LLM coaching into a lightweight Windows tray app."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10,<3.13"
authors = [
    {name = "hklhfong", email = "hklhfong@users.noreply.github.com"},
]
keywords = [
    "emotion", "health", "rppg", "heart-rate", "face-tracking",
    "computer-vision", "mediapipe", "onnx", "stress", "fatigue",
    "wellness", "affective-computing", "eye-gaze", "drowsiness",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Multimedia :: Video :: Capture",
]
dependencies = [
    "numpy>=1.23.0,<2.0.0",
    "opencv-python>=4.8.0,<4.12.0",
    "mediapipe==0.10.14",
    "scipy>=1.10.0",
    "pandas>=1.5.0",
    "onnxruntime-directml>=1.18.0",
    "hsemotion-onnx>=0.3.1",
    "pystray>=0.19.5",
    "Pillow>=10.0.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = ["pyinstaller>=6.0", "build", "twine"]

[project.urls]
Homepage = "https://github.com/hklhfong/ai-emotion-health-tracker"
Repository = "https://github.com/hklhfong/ai-emotion-health-tracker"
"Bug Tracker" = "https://github.com/hklhfong/ai-emotion-health-tracker/issues"

[project.scripts]
ai-tracker = "cli:run_visual"
ai-tracker-tray = "cli:run_tray"
ai-tracker-coach = "cli:run_coach"

[tool.setuptools]
py-modules = [
    "main", "service", "tray_app", "cli",
    "face_engine", "health_engine", "emotion_engine",
    "database", "report_organizer", "input_monitor",
    "notifier", "ai_coach", "run_coach", "export_history",
]
